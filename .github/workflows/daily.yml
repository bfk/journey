name: Journey daily prompt

on:
  schedule:
    # Runs every 2 hours, not just at the target hour: journey/run.py itself
    # checks the local wall-clock time and only sends once per day, at
    # JOURNEY_SEND_HOUR. This sidesteps GitHub Actions cron being UTC-only
    # with no DST awareness, and means a reply is picked up within a couple
    # of hours instead of a full day.
    #
    # Was hourly; observed in practice (see README Known limitations) that
    # GitHub's schedule trigger degrades badly over consecutive days at that
    # frequency -- gaps grew from ~90min to 800+min over about a week, well
    # past documented top-of-hour jitter. Lower frequency is the standard
    # mitigation for this, though not a guarantee -- see --backfill-date in
    # journey/run.py for recovering a day that gets skipped regardless.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

concurrency:
  # Prevents a manual "Run workflow" click from ever overlapping with the
  # hourly schedule (or with another manual click) -- both would pull,
  # mutate, and push state.json at once otherwise. Queues rather than
  # cancels, so an in-flight commit/push is never interrupted.
  group: journey-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only for the keepalive commit back to this repo
    steps:
      - name: Check out journey (code)
        uses: actions/checkout@v4

      - name: Keep this scheduled workflow alive
        # GitHub auto-disables scheduled workflows after 60 days of no
        # activity in the repo the workflow lives in -- and our actual daily
        # activity all lands in the entries repo, not here, so this repo's
        # own clock would otherwise only reset when the code itself changes.
        # Nudge it with a trivial commit well before the 60-day cutoff so the
        # schedule never lapses, rather than trying to warn about a disable
        # that (by definition) couldn't run to warn anyone once it happens.
        run: |
          days_since_last_commit=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since journey's last commit: $days_since_last_commit"
          if [ "$days_since_last_commit" -ge 45 ]; then
            git config user.name "journey-bot"
            git config user.email "journey-bot@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -m "chore: keepalive (scheduled workflows auto-disable after 60 days of repo inactivity)"
            git push
          fi

      - name: Check out the entries repo (journal data)
        uses: actions/checkout@v4
        with:
          # ENTRIES_REPO is a secret, not a repo variable, on purpose: this
          # step's own log line ("Syncing repository: <value>") would print
          # a plain variable's value into the (potentially public) run log
          # unredacted. Only secrets.* get automatically masked in logs.
          repository: ${{ secrets.ENTRIES_REPO }}
          token: ${{ secrets.ENTRIES_REPO_TOKEN }}
          path: entries-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure tzdata is available
        run: pip install tzdata

      - name: Configure git identity for entries repo
        working-directory: entries-repo
        run: |
          git config user.name "journey-bot"
          git config user.email "journey-bot@users.noreply.github.com"

      - name: Run journey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENTRIES_REPO_PATH: ${{ github.workspace }}/entries-repo
          # Only used for the PAT-expiry health check (journey/health.py) --
          # git itself already has push access via actions/checkout's token
          # input above; this just lets the script make one read-only API
          # call with the same token to ask GitHub when it expires.
          ENTRIES_REPO_TOKEN: ${{ secrets.ENTRIES_REPO_TOKEN }}
          ENTRIES_REPO: ${{ secrets.ENTRIES_REPO }}
          JOURNEY_TIMEZONE: Europe/London
          JOURNEY_SEND_HOUR: "21"
        run: python3 -m journey.run
